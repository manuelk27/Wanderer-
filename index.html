<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Wanderer — Audio Guide</title>
<meta name="theme-color" content="#0a0a08">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wanderer">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a08;
    --surface: #111110;
    --surface2: #1a1a17;
    --gold: #c9a84c;
    --gold-dim: #7a6330;
    --cream: #e8e0cc;
    --muted: #5a5a52;
    --red: #c0392b;
    --green: #4caf82;
    --radius: 2px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--cream);
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: auto;
  }

  /* Grain overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 999;
    opacity: 0.4;
  }

  header {
    padding: 20px 24px 12px;
    border-bottom: 1px solid #222;
    display: flex;
    align-items: baseline;
    gap: 12px;
  }

  .logo {
    font-family: 'Cormorant Garamond', serif;
    font-size: 28px;
    font-weight: 300;
    font-style: italic;
    color: var(--gold);
    letter-spacing: 2px;
  }

  .logo-sub {
    color: var(--muted);
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  /* Status bar */
  .status-bar {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 10px 24px;
    background: var(--surface);
    border-bottom: 1px solid #1e1e1a;
    font-size: 10px;
    letter-spacing: 1px;
  }

  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--muted);
    flex-shrink: 0;
  }
  .dot.active { background: var(--green); box-shadow: 0 0 6px var(--green); animation: pulse 2s infinite; }
  .dot.error { background: var(--red); }
  .dot.searching { background: var(--gold); animation: pulse 1s infinite; }

  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  #status-text { color: var(--muted); }

  /* Coords display */
  .coords {
    margin-left: auto;
    color: var(--muted);
    font-size: 10px;
    font-family: 'Space Mono', monospace;
  }

  /* Main area */
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  .poi-list {
    flex: 1;
    padding: 0 24px 24px;
  }

  /* Now playing */
  .now-playing {
    padding: 20px 24px;
    border-bottom: 1px solid #1e1e1a;
    min-height: 140px;
    position: relative;
  }

  .np-label {
    font-size: 9px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--gold-dim);
    margin-bottom: 10px;
  }

  .np-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    font-weight: 300;
    color: var(--cream);
    margin-bottom: 8px;
    line-height: 1.3;
  }

  .np-distance {
    font-size: 10px;
    color: var(--gold);
    letter-spacing: 1px;
    margin-bottom: 10px;
  }

  .np-excerpt {
    color: var(--muted);
    font-size: 11px;
    line-height: 1.7;
    max-height: 60px;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
  }

  /* Speaking wave */
  .wave {
    display: flex;
    align-items: center;
    gap: 3px;
    position: absolute;
    top: 20px;
    right: 24px;
  }
  .wave span {
    display: block;
    width: 3px;
    height: 14px;
    background: var(--gold);
    border-radius: 2px;
    opacity: 0.2;
    transform-origin: bottom;
  }
  .wave.speaking span { opacity: 1; animation: wave-bar 0.8s ease-in-out infinite; }
  .wave.speaking span:nth-child(2) { animation-delay: 0.1s; }
  .wave.speaking span:nth-child(3) { animation-delay: 0.2s; }
  .wave.speaking span:nth-child(4) { animation-delay: 0.3s; }
  .wave.speaking span:nth-child(5) { animation-delay: 0.15s; }

  @keyframes wave-bar {
    0%,100% { transform: scaleY(0.3); }
    50% { transform: scaleY(1.5); }
  }

  /* POI list */
  .poi-list-label {
    font-size: 9px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
    padding: 16px 0 10px;
    border-bottom: 1px solid #1a1a17;
    margin-bottom: 2px;
  }

  .poi-item {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 12px 0;
    border-bottom: 1px solid #141412;
    cursor: pointer;
    transition: background 0.2s;
  }

  .poi-item:hover { background: var(--surface2); margin: 0 -24px; padding: 12px 24px; }
  .poi-item.active-poi { border-left: 2px solid var(--gold); padding-left: 12px; margin-left: -2px; }

  .poi-num {
    color: var(--muted);
    font-size: 10px;
    padding-top: 2px;
    min-width: 20px;
  }

  .poi-info { flex: 1; }

  .poi-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 16px;
    font-weight: 400;
    color: var(--cream);
    margin-bottom: 3px;
  }

  .poi-type {
    font-size: 9px;
    letter-spacing: 2px;
    color: var(--gold-dim);
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .poi-dist {
    font-size: 10px;
    color: var(--muted);
  }

  .poi-spoke {
    font-size: 9px;
    color: var(--green);
    letter-spacing: 1px;
    padding-top: 2px;
  }

  .poi-spoke.unspoken { color: var(--muted); }

  /* Controls */
  .controls {
    padding: 16px 24px;
    background: var(--surface);
    border-top: 1px solid #222;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    position: sticky;
    bottom: 0;
  }

  button {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    border: 1px solid var(--muted);
    background: transparent;
    color: var(--cream);
    padding: 10px 16px;
    cursor: pointer;
    border-radius: var(--radius);
    transition: all 0.2s;
  }

  button:hover { border-color: var(--gold); color: var(--gold); }

  button.primary {
    background: var(--gold);
    border-color: var(--gold);
    color: #0a0a08;
    font-weight: 700;
  }

  button.primary:hover { background: #e0bc6a; border-color: #e0bc6a; }

  button.danger { border-color: var(--red); color: var(--red); }
  button.danger:hover { background: var(--red); color: white; }

  button:disabled { opacity: 0.3; cursor: not-allowed; }

  .radius-ctrl {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-left: auto;
    color: var(--muted);
    font-size: 10px;
    letter-spacing: 1px;
  }

  .radius-ctrl select {
    background: var(--surface2);
    border: 1px solid var(--muted);
    color: var(--cream);
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    padding: 4px 8px;
    border-radius: var(--radius);
    cursor: pointer;
  }

  /* Empty state */
  .empty {
    padding: 40px 0;
    text-align: center;
    color: var(--muted);
    line-height: 2;
  }

  .empty-icon {
    font-size: 36px;
    margin-bottom: 12px;
    opacity: 0.4;
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--muted); border-radius: 2px; }
</style>
</head>
<body>

<header>
  <div class="logo">Wanderer</div>
  <div class="logo-sub">Audio Guide</div>
</header>

<div class="status-bar">
  <div class="dot" id="status-dot"></div>
  <span id="status-text">Press Start to begin</span>
  <div class="coords" id="coords-display">—</div>
</div>

<main>
  <div class="now-playing" id="now-playing">
    <div class="np-label">Now Speaking</div>
    <div class="np-title" id="np-title">—</div>
    <div class="np-distance" id="np-distance"></div>
    <div class="np-excerpt" id="np-excerpt">Your audio guide will narrate cultural highlights as you move through them.</div>
    <div class="wave" id="wave">
      <span></span><span></span><span></span><span></span><span></span>
    </div>
  </div>

  <div class="poi-list">
    <div class="poi-list-label">Nearby Landmarks</div>
    <div id="poi-container">
      <div class="empty">
        <div class="empty-icon">🗺</div>
        <div>No landmarks loaded yet.<br>Press Start to detect your location.</div>
      </div>
    </div>
  </div>
</main>

<div class="controls">
  <button class="primary" id="btn-start" onclick="startGuide()">▶ Start</button>
  <button id="btn-stop" onclick="stopGuide()" disabled>■ Stop</button>
  <button id="btn-refresh" onclick="refreshPOIs()" disabled>↺ Refresh</button>
  <button id="btn-skip" onclick="skipCurrent()" disabled>Skip →</button>
  <div class="radius-ctrl">
    <span>Radius</span>
    <select id="radius-select">
      <option value="5">5m</option>
      <option value="10">10m</option>
      <option value="50">50m</option>
      <option value="200">200m</option>
      <option value="500" selected>500m</option>
      <option value="1000">1km</option>
      <option value="2000">2km</option>
    </select>
  </div>
  <div class="radius-ctrl">
    <span>Refresh</span>
    <select id="refresh-select" onchange="updateRefreshRate()">
      <option value="0">Off</option>
      <option value="5000">5s</option>
      <option value="10000" selected>10s</option>
      <option value="30000">30s</option>
      <option value="60000">1min</option>
    </select>
  </div>
</div>

<script>
// ─── State ────────────────────────────────────────────────────
let watchId = null;
let currentPos = null;
let pois = [];         // [{id, name, type, lat, lon, dist, spoken, summary}]
let speaking = false;
let paused = false;
let currentSpeech = null;
let spokenIds = new Set();
let fetchedWikiIds = new Set();
let active = false;
let autoRefreshTimer = null;

// Trigger narration if within this many metres — dynamically read from radius
function getTriggerDistance() { return Math.max(30, parseInt(document.getElementById("radius-select")?.value || 80)); }

// OSM types we want (cultural, historic, touristic)
const WANTED_TOURISM = ['museum','gallery','artwork','attraction','viewpoint','monument','castle','ruins'];
const WANTED_HISTORIC = ['monument','memorial','castle','ruins','church','archaeological_site','wayside_cross','battlefield','building','manor','palace'];
const WANTED_AMENITY  = ['place_of_worship','theatre','library'];

// ─── Geo helpers ─────────────────────────────────────────────
function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function formatDist(m) {
  return m < 1000 ? `${Math.round(m)}m away` : `${(m/1000).toFixed(1)}km away`;
}

// ─── Start / Stop ─────────────────────────────────────────────
function startGuide() {
  if (!navigator.geolocation) { setStatus('Geolocation not supported', 'error'); return; }

  active = true;
  setStatus('Acquiring location…', 'searching');
  document.getElementById('btn-start').disabled = true;
  document.getElementById('btn-stop').disabled = false;
  document.getElementById('btn-refresh').disabled = false;
  document.getElementById('btn-skip').disabled = false;

  updateRefreshRate();
  watchId = navigator.geolocation.watchPosition(onPosition, onGeoError, {
    enableHighAccuracy: true,
    maximumAge: 5000,
    timeout: 15000
  });
}

function updateRefreshRate() {
  if (!active) return;
  clearInterval(autoRefreshTimer);
  const rate = parseInt(document.getElementById('refresh-select').value);
  if (rate > 0) {
    autoRefreshTimer = setInterval(async () => {
      if (currentPos && !speaking) {
        pois.forEach(p => { p.dist = Math.round(haversine(currentPos.lat, currentPos.lon, p.lat, p.lon)); });
        pois.sort((a,b) => a.dist - b.dist);
        renderPOIs();
        checkProximityTriggers();
        // Re-fetch OSM if moved enough
        const moved = lastFetchPos ? haversine(currentPos.lat, currentPos.lon, lastFetchPos.lat, lastFetchPos.lon) : 999;
        if (moved > 30) { lastFetchPos = { ...currentPos }; await fetchPOIs(currentPos.lat, currentPos.lon); }
      }
    }, rate);
  }
}

function stopGuide() {
  active = false;
  clearInterval(autoRefreshTimer);
  autoRefreshTimer = null;
  if (watchId) navigator.geolocation.clearWatch(watchId);
  watchId = null;
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  speaking = false;
  updateWave();
  setStatus('Stopped', 'idle');
  document.getElementById('btn-start').disabled = false;
  document.getElementById('btn-stop').disabled = true;
  document.getElementById('btn-refresh').disabled = true;
  document.getElementById('btn-skip').disabled = true;
}

function skipCurrent() {
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  speaking = false;
  updateWave();
}

async function refreshPOIs() {
  if (!currentPos) return;
  spokenIds.clear();
  fetchedWikiIds.clear();
  pois = [];
  renderPOIs();
  await fetchPOIs(currentPos.lat, currentPos.lon);
}

// ─── Geolocation ──────────────────────────────────────────────
let lastFetchPos = null;

async function onPosition(pos) {
  const lat = pos.coords.latitude;
  const lon = pos.coords.longitude;
  currentPos = { lat, lon };

  document.getElementById('coords-display').textContent =
    `${lat.toFixed(5)}, ${lon.toFixed(5)}`;

  setStatus('Active — scanning surroundings', 'active');

  // Update distances
  pois.forEach(p => { p.dist = Math.round(haversine(lat, lon, p.lat, p.lon)); });
  pois.sort((a,b) => a.dist - b.dist);

  // Fetch new POIs if moved >100m from last fetch
  const moved = lastFetchPos
    ? haversine(lat, lon, lastFetchPos.lat, lastFetchPos.lon)
    : 999;

  if (moved > 100) {
    lastFetchPos = { lat, lon };
    await fetchPOIs(lat, lon);
  } else {
    renderPOIs();
    checkProximityTriggers();
  }
}

function onGeoError(err) {
  setStatus(`Location error: ${err.message}`, 'error');
}


// ─── Overpass (OSM) ────────────────────────────────────────────
async function fetchPOIs(lat, lon) {
  const radius = document.getElementById('radius-select').value;
  setStatus('Fetching nearby landmarks…', 'searching');

  const query = `
    [out:json][timeout:20];
    (
      node["tourism"~"museum|gallery|artwork|attraction|viewpoint|monument|castle|ruins"](around:${radius},${lat},${lon});
      node["historic"~"monument|memorial|castle|ruins|church|archaeological_site|wayside_cross|battlefield|building|manor|palace"](around:${radius},${lat},${lon});
      node["amenity"~"place_of_worship|theatre|library"](around:${radius},${lat},${lon});
      way["tourism"~"museum|gallery|attraction|viewpoint|monument|castle|ruins"](around:${radius},${lat},${lon});
      way["historic"~"monument|memorial|castle|ruins|church|archaeological_site|battlefield|manor|palace"](around:${radius},${lat},${lon});
      way["amenity"~"theatre|library"](around:${radius},${lat},${lon});
    );
    out center tags;
  `;

  try {
    const res = await fetch('https://overpass-api.de/api/interpreter', {
      method: 'POST',
      body: `data=${encodeURIComponent(query)}`
    });
    const json = await res.json();
    processPOIs(json.elements, lat, lon);
    setStatus('Active — scanning surroundings', 'active');
  } catch(e) {
    setStatus('Could not reach Overpass API', 'error');
  }
}

function processPOIs(elements, lat, lon) {
  const seen = new Set(pois.map(p => p.id));

  elements.forEach(el => {
    if (seen.has(el.id)) return;
    if (!el.tags?.name) return;

    const elLat = el.lat ?? el.center?.lat;
    const elLon = el.lon ?? el.center?.lon;
    if (!elLat || !elLon) return;

    const dist = Math.round(haversine(lat, lon, elLat, elLon));
    const type = el.tags.tourism || el.tags.historic || el.tags.amenity || 'landmark';

    pois.push({
      id: el.id,
      name: el.tags.name,
      type,
      lat: elLat,
      lon: elLon,
      dist,
      spoken: false,
      summary: null,
      wikiTitle: el.tags['wikipedia'] ? el.tags['wikipedia'].replace(/^en:/, '') : null,
      wikidata: el.tags['wikidata'] || null
    });
  });

  pois.sort((a,b) => a.dist - b.dist);
  renderPOIs();
  checkProximityTriggers();
}

// ─── Wikipedia + Claude Quirky Rewrite ───────────────────────
async function fetchRawWiki(poi) {
  let title = poi.wikiTitle || poi.name;
  try {
    const url = `https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title)}`;
    const res = await fetch(url);
    if (res.ok) {
      const data = await res.json();
      if (data.extract && data.extract.length > 50) return data.extract;
    }
  } catch(_) {}

  try {
    const searchUrl = `https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(poi.name)}&format=json&origin=*&srlimit=1`;
    const res2 = await fetch(searchUrl);
    const data2 = await res2.json();
    const title2 = data2?.query?.search?.[0]?.title;
    if (title2) {
      const res3 = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title2)}`);
      if (res3.ok) {
        const data3 = await res3.json();
        if (data3.extract) return data3.extract;
      }
    }
  } catch(_) {}

  return null;
}

async function rewriteQuirky(poi, rawText) {
  const prompt = rawText
    ? `You are a witty, curious street-level audio guide. Rewrite this Wikipedia extract about "${poi.name}" as a single punchy spoken sentence or two (max 35 words). Start with a vivid spatial cue like "Just ahead", "On your left", "Beneath your feet", "The building you're passing" etc. Be specific, surprising, and conversational — like a knowledgeable friend whispering an interesting secret, not a museum plaque. No fluff. Raw info:\n\n${rawText.substring(0,600)}`
    : `You are a witty audio guide. Write a single intriguing spoken sentence (max 30 words) about "${poi.name}", a ${poi.type.replace(/_/g,' ')} you're walking past. Start with a spatial cue. Be specific and surprising.`;

  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 120,
        messages: [{ role: "user", content: prompt }]
      })
    });
    const data = await res.json();
    const text = data?.content?.[0]?.text?.trim();
    if (text && text.length > 10) return text;
  } catch(_) {}

  // Fallback if Claude unreachable
  return rawText
    ? rawText.split('. ').slice(0,2).join('. ') + '.'
    : `${poi.name} — a ${poi.type.replace(/_/g,' ')} worth a moment's notice.`;
}

async function fetchWikiSummary(poi) {
  if (fetchedWikiIds.has(poi.id)) return poi.summary;
  fetchedWikiIds.add(poi.id);

  const raw = await fetchRawWiki(poi);
  const quirky = await rewriteQuirky(poi, raw);
  poi.summary = quirky;
  poi.rawSummary = raw;
  return poi.summary;
}

// ─── Proximity Triggers ───────────────────────────────────────
async function checkProximityTriggers() {
  if (!active || speaking) return;

  const nearby = pois.filter(p => p.dist <= getTriggerDistance() && !spokenIds.has(p.id));
  if (nearby.length === 0) return;

  const target = nearby[0];
  spokenIds.add(target.id);
  target.spoken = true;
  renderPOIs();

  // Fetch wiki summary if not yet fetched
  const summary = await fetchWikiSummary(target);
  narrate(target, summary);
}

// ─── Speech ───────────────────────────────────────────────────
function narrate(poi, summary) {
  if (!active) return;
  if (!window.speechSynthesis) {
    // No TTS available — just update UI
    updateNowPlaying(poi, summary);
    setTimeout(() => { speaking = false; updateWave(); renderPOIs(); checkProximityTriggers(); }, 3000);
    return;
  }
  window.speechSynthesis.cancel();

  // Trim summary to reasonable length for narration
  const text = summary.length > 600
    ? summary.substring(0, summary.lastIndexOf(' ', 600)) + '.'
    : summary;

  const utterance = new SpeechSynthesisUtterance();
  utterance.text = `Approaching ${poi.name}. ${text}`;
  utterance.rate = 0.88;
  utterance.pitch = 0.95;
  utterance.volume = 1;

  // Pick a pleasant English voice if available
  const voices = window.speechSynthesis.getVoices();
  const preferred = voices.find(v => v.lang.startsWith('en') && v.name.toLowerCase().includes('daniel'))
    || voices.find(v => v.lang.startsWith('en') && v.localService)
    || voices.find(v => v.lang.startsWith('en'))
    || voices[0];
  if (preferred) utterance.voice = preferred;

  utterance.onstart = () => {
    speaking = true;
    updateWave();
    updateNowPlaying(poi, text);
    renderPOIs();
  };

  utterance.onend = () => {
    speaking = false;
    updateWave();
    renderPOIs();
    // Check for next trigger after a pause
    setTimeout(checkProximityTriggers, 2000);
  };

  utterance.onerror = () => {
    speaking = false;
    updateWave();
  };

  window.speechSynthesis.speak(utterance);
}

// ─── Manual tap on POI ────────────────────────────────────────
async function speakPOI(id) {
  if (!active) return;
  const poi = pois.find(p => p.id === id);
  if (!poi) return;
  spokenIds.add(id);
  poi.spoken = true;
  const summary = await fetchWikiSummary(poi);
  narrate(poi, summary);
}

// ─── UI ───────────────────────────────────────────────────────
function setStatus(text, state) {
  document.getElementById('status-text').textContent = text;
  const dot = document.getElementById('status-dot');
  dot.className = 'dot';
  if (state === 'active') dot.classList.add('active');
  else if (state === 'error') dot.classList.add('error');
  else if (state === 'searching') dot.classList.add('searching');
}

function updateWave() {
  const wave = document.getElementById('wave');
  wave.className = speaking ? 'wave speaking' : 'wave';
}

function updateNowPlaying(poi, summary) {
  document.getElementById('np-title').textContent = poi.name;
  document.getElementById('np-distance').textContent = formatDist(poi.dist);
  document.getElementById('np-excerpt').textContent = summary || '';
}

function renderPOIs() {
  const container = document.getElementById('poi-container');
  if (pois.length === 0) {
    container.innerHTML = `<div class="empty"><div class="empty-icon">🔍</div><div>No cultural landmarks found nearby.<br>Try increasing the search radius.</div></div>`;
    return;
  }

  container.innerHTML = pois.slice(0, 30).map((p, i) => `
    <div class="poi-item ${speaking && p.spoken && !spokenIds.size ? 'active-poi' : ''}" onclick="speakPOI(${p.id})">
      <div class="poi-num">${String(i+1).padStart(2,'0')}</div>
      <div class="poi-info">
        <div class="poi-name">${p.name}</div>
        <div class="poi-type">${p.type.replace(/_/g,' ')}</div>
        <div class="poi-dist">${formatDist(p.dist)}</div>
      </div>
      <div class="poi-spoke ${p.spoken ? '' : 'unspoken'}">${p.spoken ? '◉ heard' : '○'}</div>
    </div>
  `).join('');
}

// ─── Voice loading ────────────────────────────────────────────
// Some browsers load voices asynchronously
if (window.speechSynthesis) {
  window.speechSynthesis.onvoiceschanged = () => {};
}
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
